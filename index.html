<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pájaro</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* TEXTO */

        #texto {
            position: absolute;
            left: 50%;
            top: 12%;

            transform: translateX(-50%);

            width: 80%;

            text-align: center;

            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(20px, 3vw, 38px);
            line-height: 1.3;

            color: rgba(70, 70, 80, 0.9);

            text-shadow:
                0 1px 2px rgba(255, 255, 255, 0.9);

            opacity: 0;

            pointer-events: none;

            transition: opacity 1.5s ease;
        }

        #texto.visible {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="video-container">

        <video id="video" autoplay muted playsinline>
            <source src="video%20mujer%20pajaro.mp4" type="video/mp4">
            Tu navegador no puede reproducir este video.
        </video>

        <div id="texto"></div>

    </div>


    <script>

        const video = document.getElementById("video");
        const texto = document.getElementById("texto");

        video.addEventListener("timeupdate", function () {

            if (video.currentTime >= 4 && video.currentTime < 9) {

                texto.textContent =
                    "Hay caminos que empiezan esperando.";

                texto.classList.add("visible");

            } else {

                texto.classList.remove("visible");

            }

        });

    </script>

</body>
</html>
