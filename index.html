<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pájaro</title>

    <style>

        /* =====================================================
           PÁGINA
           ===================================================== */

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =====================================================
           VIDEO
           ===================================================== */

        video {
            display: block;

            width: 100%;
            height: 100%;

            max-width: 100vw;
            max-height: 100vh;

            object-fit: contain;

            margin: 0;
            padding: 0;

            cursor: pointer;
        }


        /* =====================================================
           MENSAJE INICIAL
           ===================================================== */

        #mensajeInicial {

            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 90%;

            color: white;

            font-family: Georgia, serif;

            font-size: clamp(20px, 4vw, 32px);

            letter-spacing: 3px;

            text-align: center;

            text-shadow:
                0 2px 8px rgba(0,0,0,0.8);

            cursor: pointer;

            z-index: 10;

            transition: opacity 0.8s ease;
        }


        #mensajeInicial.oculto {

            opacity: 0;

            pointer-events: none;
        }


        /* =====================================================
           TEXTO DE LA HISTORIA
           ===================================================== */

        #texto {

            position: absolute;

            left: 50%;
            top: 12%;

            transform: translateX(-50%);

            width: 86%;
            max-width: 1200px;

            text-align: center;

            font-family: Georgia, "Times New Roman", serif;

            font-size: clamp(38px, 7vw, 90px);

            line-height: 1.25;

            color: #18151a;

            mix-blend-mode: multiply;

            text-shadow:
                0 1px 4px rgba(255,255,255,0.35);

            opacity: 0;

            pointer-events: none;

            z-index: 8;

            transition:
                opacity 1.5s ease,
                filter 1.5s ease;

            filter: blur(3px);
        }


        /* =====================================================
           TEXTO VISIBLE
           ===================================================== */

        #texto.visible {

            opacity: 0.88;

            filter: blur(0);
        }


        /* =====================================================
           CELULAR
           ===================================================== */

        @media (max-width: 600px) {

            #texto {

                width: 88%;

                top: 10%;

                font-size: clamp(34px, 9vw, 60px);

                line-height: 1.25;
            }


            #mensajeInicial {

                font-size: clamp(18px, 5vw, 25px);

                letter-spacing: 2px;
            }
        }


        /* =====================================================
           PANTALLAS GRANDES
           ===================================================== */

        @media (min-width: 1200px) {

            #texto {

                width: 54%;

                top: 12%;

                font-size: clamp(55px, 5.8vw, 90px);
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         VIDEO
         ===================================================== -->

    <video id="video" autoplay muted playsinline>

        <source
            src="video%20mujer%20pajaro.mp4"
            type="video/mp4">

    </video>


    <!-- =====================================================
         MENSAJE INICIAL
         ===================================================== -->

    <div id="mensajeInicial">

        TOCA PARA COMENZAR

    </div>


    <!-- =====================================================
         TEXTO
         ===================================================== -->

    <div id="texto"></div>


    <script>


        /* =====================================================
           ELEMENTOS
           ===================================================== */

        const video =
            document.getElementById("video");

        const mensajeInicial =
            document.getElementById("mensajeInicial");

        const texto =
            document.getElementById("texto");


        /* =====================================================
           ACTIVAR EL VIDEO
           ===================================================== */

        function comenzar() {

            video.muted = false;

            video.play();

            mensajeInicial.classList.add("oculto");
        }


        /* =====================================================
           TOCAR PARA COMENZAR
           ===================================================== */

        mensajeInicial.addEventListener(
            "click",
            comenzar
        );

        video.addEventListener(
            "click",
            comenzar
        );


        /* =====================================================
           PRIMERA FRASE — PRUEBA
           ===================================================== */

       /* =====================================================
   HISTORIAS
   ===================================================== */

const historias = [

    {
        frases: [
            "Hay caminos que empiezan esperando.",
            "Y encuentros que llegan sin avisar.",
            "Solo había que atreverse a seguirlo.",
            "No todo viaje necesita llevarte lejos."
        ]
    },

    {
        frases: [
            "No desprecies lo pequeño.",
            "Algunas cosas enormes comienzan con muy poco.",
            "A veces basta con compartir.",
            "Y descubrirás cuánto puede crecer un gesto."
        ]
    },

    {
        frases: [
            "Si no sabes hacia dónde ir...",
            "quizá no tengas que saberlo todavía.",
            "Da el siguiente paso.",
            "El camino también se descubre andando."
        ]
    },

    {
        frases: [
            "Hay días en que hasta el cielo parece lejos.",
            "Entonces alguien pequeño puede recordarte que existe.",
            "Levanta la mirada.",
            "La tristeza también sabe volver a casa."
        ]
    },

    {
        frases: [
            "Quizá no necesitas llevarlo todo contigo.",
            "Algunas cosas pesan más de lo que parecen.",
            "Suelta un poco.",
            "A veces así comienza el vuelo."
        ]
    },

    {
        frases: [
            "Ella llevaba una maleta.",
            "El pájaro llevaba el cielo.",
            "Ninguno sabía que se estaban esperando.",
            "Hasta que se encontraron."
        ]
    },

    {
        frases: [
            "Quizá no te perdiste.",
            "Quizá simplemente cambiaste de rumbo.",
            "A veces el desvío guarda algo que el camino no tenía.",
            "Y también puede llevarte a casa."
        ]
    },

    {
        frases: [
            "No sabía qué podía ofrecerle.",
            "Así que le dio lo poco que tenía.",
            "Y recibió a cambio algo imposible.",
            "Algunas cosas crecen cuando se comparten."
        ]
    },

    {
        frases: [
            "Algunas oportunidades llegan disfrazadas de casualidad.",
            "Otras parecen demasiado pequeñas para importar.",
            "Hasta que decides acercarte.",
            "Y entonces el cielo cambia de tamaño."
        ]
    },

    {
        frases: [
            "Había esperado tanto que casi había olvidado por qué.",
            "Entonces algo pequeño apareció junto a ella.",
            "No preguntó hacia dónde iba.",
            "Simplemente decidió acompañarlo."
        ]
    },

    {
        frases: [
            "Había llevado aquella maleta demasiado lejos.",
            "Dentro guardaba cosas que ya no necesitaba.",
            "Cuando la abrió, descubrió que también podía dejar algunas atrás.",
            "Y de pronto, volar fue más fácil."
        ]
    },

    {
        frases: [
            "Tenía miedo de subir.",
            "El pájaro también parecía pequeño para llevarla.",
            "Pero ninguno de los dos sabía todavía de lo que era capaz.",
            "A veces el valor aparece después del primer paso."
        ]
    },

    {
        frases: [
            "Algunas cosas desaparecen sin despedirse.",
            "Otras regresan cuando ya no las esperabas.",
            "Quizá no vuelvan de la misma manera.",
            "Pero pueden traerte algo nuevo."
        ]
    },

    {
        frases: [
            "Miraba el cielo desde abajo.",
            "Pensaba que estaba demasiado lejos.",
            "Nunca imaginó que un día lo atravesaría.",
            "Hay sueños que esperan una forma de llegar hasta ellos."
        ]
    },

    {
        frases: [
            "No parecía una señal.",
            "Era apenas un pájaro pequeño junto a una maleta.",
            "Pero decidió prestar atención.",
            "A veces una señal comienza siendo algo que casi pasamos por alto."
        ]
    },

    {
        frases: [
            "No sabía adónde la llevaría.",
            "Tampoco sabía cuánto podía confiar en él.",
            "Solo sabía que quería intentarlo.",
            "Y eso fue suficiente para despegar."
        ]
    },

    {
        frases: [
            "Quizá no era momento de seguir caminando.",
            "Quizá era momento de detenerse.",
            "De mirar alrededor.",
            "Porque incluso una pausa puede esconder un comienzo."
        ]
    },

    {
        frases: [
            "Era un pájaro diminuto.",
            "Una mujer cansada.",
            "Una maleta llena de cosas sin importancia.",
            "Y, por alguna razón, todo eso fue suficiente."
        ]
    },

    {
        frases: [
            "Cuando regresaron, todo parecía estar igual.",
            "La playa seguía allí.",
            "La maleta también.",
            "Pero ella había visto el mundo desde arriba."
        ]
    },

    {
        frases: [
            "Había salido sin esperar nada.",
            "Entonces encontró algo que no estaba buscando.",
            "No se parecía a ninguno de sus planes.",
            "Quizá por eso era exactamente lo que necesitaba."
        ]
    },

    {
        frases: [
            "Hay cosas que pierden valor cuando las guardamos demasiado.",
            "Y otras que se vuelven enormes al compartirlas.",
            "Ella ofreció un pedazo de pan.",
            "El cielo hizo el resto."
        ]
    },

    {
        frases: [
            "Todo gran viaje parece imposible desde el principio.",
            "Sobre todo cuando el primer compañero parece demasiado pequeño.",
            "Pero nadie conoce su propia fuerza antes de necesitarla.",
            "Todo vuelo alguna vez fue un comienzo."
        ]
    },

    {
        frases: [
            "Irse no siempre significa abandonar.",
            "Volver no siempre significa retroceder.",
            "A veces necesitas conocer el cielo.",
            "Para mirar tu lugar de siempre con otros ojos."
        ]
    },

    {
        frases: [
            "Había estado buscando una respuesta.",
            "La buscó en todas partes.",
            "Hasta que dejó de buscar y miró a su lado.",
            "Algunas respuestas llegan con alas."
        ]
    },

    {
        frases: [
            "Tal vez mañana vuelva a estar allí.",
            "Con su maleta, frente al mismo mar.",
            "Y quizá el pequeño pájaro vuelva a aparecer.",
            "Algunas historias merecen comenzar otra vez."
        ]
    }

];


/* =====================================================
   ELEGIR UNA HISTORIA AL AZAR
   ===================================================== */

const historia =
    historias[
        Math.floor(
            Math.random() * historias.length
        )
    ];


/* =====================================================
   FRASE ACTUAL
   ===================================================== */

let fraseActual = -1;


/* =====================================================
   CAMBIO DE FRASES
   ===================================================== */

video.addEventListener(
    "timeupdate",
    function() {

        let nuevaFrase = -1;


        if (
            video.currentTime >= 4 &&
            video.currentTime < 13
        ) {

            nuevaFrase = 0;

        } else if (
            video.currentTime >= 13 &&
            video.currentTime < 28
        ) {

            nuevaFrase = 1;

        } else if (
            video.currentTime >= 28 &&
            video.currentTime < 50
        ) {

            nuevaFrase = 2;

        } else if (
            video.currentTime >= 50 &&
            video.currentTime < 58
        ) {

            nuevaFrase = 3;

        }


        if (nuevaFrase !== fraseActual) {

            fraseActual = nuevaFrase;


            if (fraseActual === -1) {

                texto.classList.remove(
                    "visible"
                );

            } else {

                texto.classList.remove(
                    "visible"
                );


                setTimeout(
                    function() {

                        texto.textContent =
                            historia.frases[
                                fraseActual
                            ];

                        texto.classList.add(
                            "visible"
                        );

                    },
                    700
                );

            }

        }

    }
);


    </script>


</body>
</html>
