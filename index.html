<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pájaro</title>

    <style>

        /* =====================================================
           PÁGINA
           ===================================================== */

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =====================================================
           VIDEO
           ===================================================== */

        video {
            display: block;

            width: 100%;
            height: 100%;

            max-width: 100vw;
            max-height: 100vh;

            object-fit: contain;

            margin: 0;
            padding: 0;

            cursor: pointer;
        }


        /* =====================================================
           MENSAJE INICIAL
           ===================================================== */

        #mensajeInicial {

            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 90%;

            color: white;

            font-family: Georgia, serif;

            font-size: clamp(20px, 4vw, 32px);

            letter-spacing: 3px;

            text-align: center;

            text-shadow:
                0 2px 8px rgba(0,0,0,0.8);

            cursor: pointer;

            z-index: 10;

            transition: opacity 0.8s ease;
        }


        #mensajeInicial.oculto {

            opacity: 0;

            pointer-events: none;
        }


        /* =====================================================
           TEXTO DE LA HISTORIA
           ===================================================== */

        #texto {

            position: absolute;

            left: 50%;
            top: 12%;

            transform: translateX(-50%);

            width: 86%;
            max-width: 1200px;

            text-align: center;

            font-family: Georgia, "Times New Roman", serif;

            font-size: clamp(38px, 7vw, 90px);

            line-height: 1.25;

            color: #18151a;

            mix-blend-mode: multiply;

            text-shadow:
                0 1px 4px rgba(255,255,255,0.35);

            opacity: 0;

            pointer-events: none;

            z-index: 8;

            transition:
                opacity 1.5s ease,
                filter 1.5s ease;

            filter: blur(3px);
        }


        /* =====================================================
           TEXTO VISIBLE
           ===================================================== */

        #texto.visible {

            opacity: 0.88;

            filter: blur(0);
        }


        /* =====================================================
           CELULAR
           ===================================================== */

        @media (max-width: 600px) {

            #texto {

                width: 88%;

                top: 10%;

                font-size: clamp(34px, 9vw, 60px);

                line-height: 1.25;
            }


            #mensajeInicial {

                font-size: clamp(18px, 5vw, 25px);

                letter-spacing: 2px;
            }
        }


        /* =====================================================
           PANTALLAS GRANDES
           ===================================================== */

        @media (min-width: 1200px) {

            #texto {

                width: 84%;

                top: 12%;

                font-size: clamp(55px, 5.8vw, 90px);
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         VIDEO
         ===================================================== -->

    <video id="video" autoplay muted playsinline>

        <source
            src="video%20mujer%20pajaro.mp4"
            type="video/mp4">

    </video>


    <!-- =====================================================
         MENSAJE INICIAL
         ===================================================== -->

    <div id="mensajeInicial">

        TOCA PARA COMENZAR

    </div>


    <!-- =====================================================
         TEXTO
         ===================================================== -->

    <div id="texto"></div>


    <script>


        /* =====================================================
           ELEMENTOS
           ===================================================== */

        const video =
            document.getElementById("video");

        const mensajeInicial =
            document.getElementById("mensajeInicial");

        const texto =
            document.getElementById("texto");


        /* =====================================================
           ACTIVAR EL VIDEO
           ===================================================== */

        function comenzar() {

            video.muted = false;

            video.play();

            mensajeInicial.classList.add("oculto");
        }


        /* =====================================================
           TOCAR PARA COMENZAR
           ===================================================== */

        mensajeInicial.addEventListener(
            "click",
            comenzar
        );

        video.addEventListener(
            "click",
            comenzar
        );


        /* =====================================================
           PRIMERA FRASE — PRUEBA
           ===================================================== */

        video.addEventListener(
            "timeupdate",
            function() {

                if (
                    video.currentTime >= 4 &&
                    video.currentTime < 9
                ) {

                    texto.textContent =
                        "Hay caminos que empiezan esperando.";

                    texto.classList.add("visible");

                } else {

                    texto.classList.remove("visible");

                }

            }
        );


    </script>


</body>
</html>
